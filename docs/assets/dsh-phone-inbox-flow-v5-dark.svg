<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-phone-inbox 结构图：上半是 inbox_list 的只读汇流——桥的文本标记、结构化附件块与默认关闭的 tempdir 扫描汇入匹配/合并/stat/排序，再分叉出 items[]、emptyReason 与 { ok: false, reason }；下半是 inbox_adopt 的四道门禁竖梯，一次复制跨过工作区边界，按 ctx.fs.writeText 或 node:fs 两条写通道落到工作区里的 relativePath">
