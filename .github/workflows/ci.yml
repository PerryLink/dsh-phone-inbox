name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # The family-standard gates. check:readmes also holds the four translated
      # READMEs to the English one's section count, install command and
      # configuration keys; verify:artifacts additionally asserts the built
      # entry has no default export (a stray one makes the Loader discard
      # name/inject/Config/apply).
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
      - run: pnpm run check:readmes
      - run: pnpm run check:lockfile
      # The acceptance chain: probe -> list -> adopt -> workspace-confined read,
      # plus the negative cases (capability drift, containment, name
      # neutralization). It builds its own fixture under $TMPDIR, so it needs no
      # WeChat account and no host state.
      - run: pnpm run acceptance
      # The packed tarball carries the bundle, the patch and all five READMEs.
      - name: The packed tarball carries the bundle, the patch and all five READMEs
        shell: bash
        run: |
          set -euo pipefail
          pnpm pack --pack-destination out >/dev/null
          tarball="$(ls out/*.tgz | head -n1)"
          echo "tarball: $tarball"
          # List to a file rather than piping into grep: grep -q exits at the
          # first match, tar then dies on SIGPIPE, and pipefail turns that into
          # a failed step even when every entry was present.
          tar -tzf "$tarball" > out/list.txt
          for need in \
            package/lib/index.mjs \
            package/lib/index.d.mts \
            package/package.json \
            package/cordis.patch.yml \
            package/locale/en.json \
            package/locale/zh.json \
            package/icon.svg \
            package/README.md \
            package/README-zh.md \
            package/README-es.md \
            package/README-pt.md \
            package/README-hi.md \
            package/CHANGELOG.md \
            package/SECURITY.md ; do
            grep -qx "$need" out/list.txt || { echo "missing: $need"; exit 1; }
          done
          echo "tarball contents OK"
