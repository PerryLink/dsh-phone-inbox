# pnpm 11 refuses to run dependency build scripts unless they are allowed.
# esbuild is pulled in by vitest; the toolchain otherwise stays script-free.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
  - '@deepseek-ai/dsh-working-directory@0.2.1-rc.2'
