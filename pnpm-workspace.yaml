# pnpm 11 refuses to run dependency build scripts unless they are allowed.
# esbuild is pulled in by vitest; the toolchain otherwise stays script-free.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  # pnpm matches the FIRST rule by package name and ignores later ones, so one
  # package's versions must share a single `||` union instead of one entry each.
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2 || 0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2 || 0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-working-directory@0.2.1-rc.2 || 0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-error@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-fs-patch@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-sandbox@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-session@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.3 || 0.2.2-rc.4'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.3 || 0.2.2-rc.4'
